services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: elasticsearch_semantico
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms${ES_MEM_LIMIT:-1g} -Xmx${ES_MEM_LIMIT:-1g}"
    ports:
      # Port for host access (e.g., browser or external tools)
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - elastic_net
    env_file:
      - .env

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.0
    container_name: kibana_semantico
    ports:
      - "5601:5601"
    environment:
      # Kibana connects to Elasticsearch using the service name within the Docker network
      - ELASTICSEARCH_HOSTS=${ELASTICSEARCH_HOSTS:-http://elasticsearch:9200}
    depends_on:
      - elasticsearch
    networks:
      - elastic_net
    env_file:
      - .env

  # --- NEW SERVICE FOR THE STREAMLIT APP ---
  app:
    container_name: streamlit_semantico
    # Build the image using the Dockerfile in the current directory (.)
    build: .
    ports:
      # Map host port 8501 to container port 8501 (Streamlit default)
      - "8501:8501"
    volumes:
      # Mount the data directory into the container so the app can access uploaded files
      # Use ./data for the host path and /app/data for the container path (consistent with .env)
      - ./data:/app/data
    networks:
      - elastic_net
    # Make the app wait for Elasticsearch to be healthy (basic check)
    depends_on:
      - elasticsearch
    # Pass environment variables from the .env file to the app container
    env_file:
      - .env
    # Optional: Restart policy
    restart: unless-stopped
  # --- END OF NEW SERVICE ---

networks:
  elastic_net:
    driver: bridge

volumes:
  esdata:
    driver: local